name: freeze & talk – neue Folge prüfen

# Läuft rechnerunabhängig auf GitHubs Servern.
# Freitag 14:00 UTC (~15–16 Uhr DE, je nach Sommer-/Winterzeit).
on:
  schedule:
    - cron: "0 14 * * 5"   # Freitag 14:00 UTC = 15-16 Uhr DE (Nachmittag)
    - cron: "0 18 * * 5"   # Freitag 18:00 UTC = 19-20 Uhr DE (Abend)
    - cron: "0 10 * * 6"   # Samstag 10:00 UTC = 11-12 Uhr DE
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-episode
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install --quiet youtube-transcript-api

      - name: Auf neue Folge pruefen & Seite aktualisieren
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_episode.py

      - name: Committen & pushen (nur bei Aenderung)
        if: steps.run.outputs.changed == 'true'
        env:
          MSG: ${{ steps.run.outputs.commit_msg }}
        run: |
          git config user.name "freezeclub"
          git config user.email "jana.flacke@janaflacke.de"
          git add -A
          git commit -m "${MSG:-Neue Folge automatisch uebernommen}" \
                     -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push
